<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Tropical Water Rafting</title>
    <meta name="description"
          content="Get in touch with Tropical Water Rafting. Find our address, phone, email, and send us a message about reservations or general questions.">
    <meta name="author" content="Brady Disla">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/tropicalwr_logo.jpeg" alt="Tropical Water Rafting Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="company-info">
            <h1>Tropical Water Rafting</h1>
            <address>
                <p>Rio Yaque Del Norte, 41000</p>
                <p>Jarabacoa, Dominican Republic 41000</p>
                <p><a href="tel:+18095552323">+1 809 555 2323</a></p>
                <p><a href="mailto:info@tropicalwr.com">info@tropicalwr.com</a></p>
            </address>
        </section>

        <section class="map-form-section contact-box">

            <div class="map-container">
                <iframe title="Tropical Water Rafting Location"
                        src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d15024.475141648058!2d-70.64096!3d19.113337!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8eb1c0506bbab023%3A0x6b77df73a9686036!2sJarabacoa!5e0!3m2!1sen!2sdo!4v1710000000000!5m2!1sen!2sdo"  
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <form action="#" method="post" class="form-wrapper">

                <label for="user-name">Name</label>
                <input type="text" id="user-name" name="user-name" placeholder="Your full name" required>

                <label for="user-email">Email</label>
                <input type="email" id="user-email" name="user-email" placeholder="username@example.com" required>

                <fieldset class="radio-group">
                    <legend>Message Purpose</legend>
                    <div class="radio-options">
                        <div class="radio-option-item">
                            <input type="radio" id="purpose-general" name="message-purpose" value="general-inquiry" required>
                            <label for="purpose-general">General Inquiry</label>
                        </div>
                        <div class="radio-option-item">
                            <input type="radio" id="purpose-reservation" name="message-purpose" value="reservation-question">
                            <label for="purpose-reservation">Reservation Question</label>
                        </div>
                        <div class="radio-option-item">
                            <input type="radio" id="purpose-suggestion" name="message-purpose" value="website-suggestion">
                            <label for="purpose-suggestion">Website Suggestion</label>
                        </div>
                    </div>
                </fieldset>

                <label for="user-message">Message</label>
                <textarea id="user-message" name="user-message" rows="5" placeholder="Type your message here..." required></textarea>

                <div class="checkbox-container">
                    <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                    <label for="newsletter">Please Subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>

            </form>

        </section>

        <section class="employees-section contact-box">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">

                <figure class="employee-card">
                    <img src="images/cash_gordon.jpg" alt="Cash Gordon, Instructor">
                    <figcaption>Cash Gordon — Instructor</figcaption>
                </figure>

                <figure class="employee-card">
                    <img src="images/ana_luisa.jpg" alt="Ana Luisa, River Guide">
                    <figcaption>Ana Luisa — River Guide</figcaption>
                </figure>

                <figure class="employee-card">
                    <img src="images/lucas_peek.jpg" alt="Lucas Peek, Safety Director">
                    <figcaption>Lucas Peek — Safety Director</figcaption>
                </figure>

            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 | 🐳Tropical Water Rafting | Brady Disla🐳</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook-square.jpg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin.jpg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram-square.jpg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>
</html>
